<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="author" content="宗燡" />
  <meta name="copyright" content="宗燡" />
  <meta name="license" content="CC BY 4.0" />
  <meta name="description" content="小工具合集：数字起卦、八字笔记生成器、时差计算。作者：宗燡。" />
  <title>小工具 · 宗燡</title>
  <meta name="theme-color" content="#0f1419" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="小工具" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
  <script src="./vendor/lunar.js"></script>
  <style>

:root {
  --bg: #0f1419;
  --card: #1a222c;
  --text: #e8eef4;
  --muted: #8b9aab;
  --accent: #c9a227;
  --line: #2a3542;
  --tier-red: #e85d5d;
  --tier-blue: #5b8fd9;
  --tier-black: #c5ced8;
  --tier-green: #5fad6e;
  --btn: #f2f4f7;
  --btn-text: #1a222c;
  --banner: #243041;
  --warn: #e6b422;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  background: radial-gradient(1200px 600px at 20% -10%, #1e2a38, var(--bg));
  color: var(--text);
  padding: 24px;
}
.view { display: none; }
.view.active {
  display: flex; align-items: center; justify-content: center;
  min-height: calc(100vh - 48px);
}
#view-bz.active { align-items: flex-start; }
.home-card {
  width: min(420px, 100%);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 28px 24px;
  box-shadow: 0 20px 50px rgba(0,0,0,.35);
}
.home-card h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 600; }
.home-card .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; line-height: 1.5; }
.nav-btn {
  margin-top: 12px; width: 100%; padding: 12px;
  border: none; border-radius: 10px; cursor: pointer;
  background: #f2f4f7; color: #1a222c; font-weight: 600; font-size: 1rem;
}
.nav-btn:first-of-type { margin-top: 0; }
.nav-btn:hover { filter: brightness(1.05); }
.credit {
  margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
  color: var(--muted); font-size: .8rem; line-height: 1.6; text-align: center;
}
.credit strong { color: var(--text); font-weight: 600; }
.back-btn {
  display: inline-block !important; width: auto !important;
  margin: 0 0 14px 0 !important; padding: 8px 14px !important;
  border: 1px solid var(--line) !important; border-radius: 10px; cursor: pointer;
  background: #243041 !important; color: var(--text) !important;
  font-weight: 600 !important; font-size: .88rem !important;
}
.back-btn:hover { filter: brightness(1.08); }

/* ===== 数字起卦 ===== */

    
    
        #view-qg .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    #view-qg h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 600; }

    #view-qg .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; line-height: 1.5; }

    #view-qg label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }

    #view-qg input {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: #121820; color: var(--text);
      font-size: 1.1rem; letter-spacing: .04em;
    }

    #view-qg input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    #view-qg button {
      margin-top: 14px; width: 100%; padding: 12px;
      border: none; border-radius: 10px; cursor: pointer;
      background: #qg-f2f4f7; color: #1a222c; font-weight: 600; font-size: 1rem;
    }

    #view-qg button:hover { filter: brightness(1.05); }

    #view-qg button.secondary { margin-top: 10px; }

    #view-qg #qg-chart {
      display: none; margin-top: 16px;
    }

    #view-qg #qg-chart.show { display: block; }

    #view-qg #qg-chart .legend {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 12px; font-size: .85rem; color: var(--muted);
    }

    #view-qg #qg-chart .legend .chip {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 2px 8px; border-radius: 999px;
      border: 1px solid var(--line); background: #121820;
    }

    #view-qg #qg-chart .legend .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }

    #view-qg #qg-chartSearch {
      font-size: .95rem; margin-bottom: 10px; letter-spacing: 0;
    }

    #view-qg #qg-jxList {
      max-height: 360px; overflow: auto;
      border: 1px solid var(--line); border-radius: 10px;
      background: #121820;
    }

    #view-qg .jx-group-title {
      position: sticky; top: 0; z-index: 1;
      padding: 8px 12px; font-size: .78rem; letter-spacing: .06em;
      color: var(--muted); background: #161d26;
      border-bottom: 1px solid var(--line);
    }

    #view-qg .jx-row {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-bottom: 1px solid #1c2530;
      font-size: .92rem;
    }

    #view-qg .jx-row:last-child { border-bottom: none; }

    #view-qg .jx-row.hidden { display: none; }

    #view-qg .jx-row.current {
      outline: 1px solid var(--accent);
      background: rgba(201,162,39,.12);
    }

    #view-qg .jx-badge {
      flex: 0 0 auto; min-width: 2.2em; text-align: center;
      font-size: .72rem; font-weight: 700; padding: 2px 6px;
      border-radius: 6px; color: #0f1419;
    }

    #view-qg .jx-badge.红 { background: var(--tier-red); color: #qg-fff; }

    #view-qg .jx-badge.蓝 { background: var(--tier-blue); color: #qg-fff; }

    #view-qg .jx-badge.黑 { background: var(--tier-black); color: #1a222c; }

    #view-qg .jx-badge.绿 { background: var(--tier-green); color: #qg-fff; }

    #view-qg .jx-badge.大吉 {
      background: var(--tier-red);
      color: #fff; margin-left: 4px; font-size: .7rem;
    }

    #view-qg .jx-code {
      flex: 0 0 2.4em; font-variant-numeric: tabular-nums;
      color: var(--muted); font-size: .88rem;
    }

    #view-qg .wx-tag { display:inline-block; font-size:.75rem; line-height:1.4; padding:0 7px; margin-left:8px; border:1px solid; border-radius:10px; vertical-align:middle; font-weight:500; }
    #view-qg .jx-name { flex: 1; min-width: 0; }

    #view-qg .jx-name .short { font-weight: 600; }

    #view-qg .jx-name .full { color: var(--muted); font-size: .8rem; margin-left: 6px; }

    #view-qg .jx-empty {
      padding: 18px; text-align: center; color: var(--muted); font-size: .9rem;
    }

    #view-qg #qg-out {
      margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line);
      display: none; line-height: 1.7; font-size: .95rem;
    }

    #view-qg #qg-out.show { display: block; }

    #view-qg .gua {
      font-size: 1.45rem; font-weight: 600; color: var(--accent);
      margin: 8px 0 8px;
    }

    #view-qg .guaci {
      color: var(--text); font-size: .95rem; line-height: 1.75;
      margin: 0 0 14px; padding: 10px 12px;
      background: #121820; border-radius: 8px; border: 1px solid var(--line);
    }

    #view-qg .guaci .label { color: var(--muted); font-size: .8rem; margin-bottom: 4px; }

    #view-qg .guaci .ancient-block {
      margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line);
    }

    #view-qg .guaci .ag-legend {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin: 0 0 8px; font-size: .72rem; color: var(--muted);
    }

    #view-qg .guaci .ag-legend .chip {
      display: inline-flex; align-items: center; gap: 4px;
    }

    #view-qg .guaci .ag-legend .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }

    
    #qg-lightbox {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: rgba(0,0,0,.75); align-items: center; justify-content: center;
      padding: 24px; cursor: zoom-out;
    }
    #qg-lightbox.show { display: flex; }
    #qg-lightbox img {
      max-width: min(92vw, 420px); max-height: 85vh;
      background: #fff; border-radius: 8px; padding: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.5); cursor: default;
    }
    #view-qg .ancient-line .ag-img { cursor: zoom-in; }

    #view-qg .guaci .ancient-line {
      font-size: 1.55rem; letter-spacing: .12em; line-height: 1.85;
      word-break: break-all;
    }

    #view-qg .guaci .ag { display: inline; vertical-align: middle; }

    #view-qg .guaci .ag-img {
      display: inline-block; height: 1.7em; width: auto; vertical-align: middle;
      margin: 0 .04em; image-rendering: -webkit-optimize-contrast;
      background: #f4f0e6; border-radius: 2px;
    }

    #view-qg .guaci .ag-img.ag-jiagu { /* black ink = 甲骨 */ }
    #view-qg .guaci .ag-img.ag-jinwen { /* blue ink = 金文 */ }

    #view-qg .guaci .ag.modern {
      font-family: "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      color: var(--muted);
      font-size: .95rem;
      letter-spacing: 0;
      vertical-align: middle;
    }

    #view-qg .meta { color: var(--muted); font-size: .88rem; }

    #view-qg .sym { font-size: 1.4rem; letter-spacing: .15em; margin-bottom: 8px; }

    #view-qg .credit {
      margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: .8rem; line-height: 1.6; text-align: center;
    }

    #view-qg .credit strong { color: var(--text); font-weight: 600; }

  
/* ===== 八字笔记 ===== */

    
    
        #view-bz .card {
      width: min(920px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    #view-bz h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 600; }

    #view-bz .sub { color: var(--muted); font-size: .9rem; margin-bottom: 20px; line-height: 1.5; }

    #view-bz .row {
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
      margin-bottom: 14px;
    }

    #view-bz .field { flex: 1; min-width: 140px; }

    #view-bz label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }

    #view-bz input[type="date"], #view-bz input[type="text"] {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: #121820; color: var(--text);
      font-size: 1rem;
    }

    #view-bz input:focus { outline: 2px solid var(--accent); border-color: transparent; }

    #view-bz .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 16px; }

    #view-bz button {
      padding: 12px 18px; border: none; border-radius: 10px; cursor: pointer;
      background: var(--btn); color: var(--btn-text); font-weight: 600; font-size: .95rem;
    }

    #view-bz button:hover { filter: brightness(1.05); }

    #view-bz button.secondary { background: #243041; color: var(--text); border: 1px solid var(--line); }

    #view-bz .msg { color: var(--muted); font-size: .88rem; margin-bottom: 10px; min-height: 1.2em; }

    #view-bz .msg.warn { color: var(--warn); }

    #view-bz .msg.err { color: #bz-e88; }

    #view-bz .table-wrap {
      max-height: 62vh; overflow: auto; border: 1px solid var(--line);
      border-radius: 10px; background: #121820;
    }

    #view-bz table { width: 100%; border-collapse: collapse; font-size: .92rem; }

    #view-bz th, #view-bz td {
      border-bottom: 1px solid var(--line); padding: 8px 10px;
      text-align: center; vertical-align: middle;
    }

    #view-bz th {
      position: sticky; top: 0; background: #1a222c; z-index: 1;
      color: var(--muted); font-weight: 600;
    }

    #view-bz tr.banner td {
      background: var(--banner); color: var(--accent); font-weight: 600;
      letter-spacing: .04em;
    }

    #view-bz tr.blank td { height: 10px; padding: 4px; background: #0f1419; border: none; }

    #view-bz td.note input {
      width: 100%; padding: 6px 8px; border-radius: 6px;
      border: 1px solid var(--line); background: #0f1419; color: var(--text);
      font-size: .9rem; text-align: left;
    }

    #view-bz .credit {
      margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: .8rem; line-height: 1.6; text-align: center;
    }

    #view-bz .credit strong { color: var(--text); font-weight: 600; }

  
/* ===== 时差计算 ===== */

    
    
        #view-sc .card {
      width: min(480px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
      position: relative;
    }

    #view-sc h1 { margin: 0 0 6px; font-size: 1.35rem; font-weight: 600; }

    #view-sc .sub { color: var(--muted); font-size: .9rem; margin-bottom: 18px; line-height: 1.5; }

    #view-sc label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 8px; }

    #view-sc .field { margin-bottom: 14px; position: relative; }

    #view-sc input, #view-sc select {
      width: 100%; padding: 12px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: #121820; color: var(--text);
      font-size: 1.05rem;
    }

    #view-sc input:focus, #view-sc select:focus { outline: 2px solid var(--accent); border-color: transparent; }

    #view-sc .suggest {
      display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px);
      max-height: 220px; overflow: auto; z-index: 5;
      background: #121820; border: 1px solid var(--line); border-radius: 10px;
      box-shadow: 0 12px 28px rgba(0,0,0,.4);
    }

    #view-sc .suggest.show { display: block; }

    #view-sc .suggest button {
      display: block; width: 100%; text-align: left; margin: 0;
      padding: 10px 14px; border: none; border-radius: 0;
      background: transparent; color: var(--text); font-weight: 400; font-size: .92rem;
      border-bottom: 1px solid var(--line);
    }

    #view-sc .suggest button:hover, #view-sc .suggest button.active { background: #1e2a38; }

    #view-sc .suggest .meta { color: var(--muted); font-size: .8rem; margin-left: 6px; }

    #view-sc .dir {
      display: flex; gap: 8px; margin-bottom: 14px;
    }

    #view-sc .dir button {
      flex: 1; padding: 10px; border-radius: 10px; cursor: pointer;
      border: 1px solid var(--line); background: #121820; color: var(--muted);
      font-weight: 600; font-size: .88rem;
    }

    #view-sc .dir button.on {
      background: var(--btn); color: var(--btn-text); border-color: transparent;
    }

    #view-sc button#sc-go {
      margin-top: 4px; width: 100%; padding: 12px;
      border: none; border-radius: 10px; cursor: pointer;
      background: var(--btn); color: var(--btn-text); font-weight: 600; font-size: 1rem;
    }

    #view-sc button#sc-go:hover { filter: brightness(1.05); }

    #view-sc #sc-out {
      margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line);
      display: none; line-height: 1.7;
    }

    #view-sc #sc-out.show { display: block; }

    #view-sc .result {
      font-size: 2.1rem; font-weight: 700; color: var(--accent);
      letter-spacing: .06em; margin: 8px 0 12px;
    }

    #view-sc .meta-line { color: var(--muted); font-size: .9rem; }

    #view-sc .err { color: #sc-e88; font-size: .9rem; margin-top: 8px; }

    #view-sc .credit {
      margin-top: 22px; padding-top: 14px; border-top: 1px solid var(--line);
      color: var(--muted); font-size: .8rem; line-height: 1.6; text-align: center;
    }

    #view-sc .credit strong { color: var(--text); font-weight: 600; }

  
  </style>
</head>
<body>
  <section id="view-home" class="view active" aria-label="主页">
    <div class="home-card">
      <h1>小工具</h1>
      <p class="sub">数字起卦 · 八字笔记 · 时差计算</p>
      <button type="button" class="nav-btn" data-go="qg">数字起卦</button>
      <button type="button" class="nav-btn" data-go="bz">八字笔记生成器</button>
      <button type="button" class="nav-btn" data-go="sc">时差计算</button>
      <footer class="credit"><div>作者：<strong>宗燡</strong></div></footer>
    </div>
  </section>

  <section id="view-qg" class="view" aria-label="数字起卦">
<div class="card">
    <button type="button" class="back-btn" data-back="home">← 返回</button>
    <h1>数字起卦</h1>
    <p class="sub">偶数对半分；奇数上卦少一位。</p>
    <label for="qg-nums">输入数字（空格分隔或连写）</label>
    <input id="qg-nums" placeholder="例如 5 3 或 1234" autocomplete="off" />
    <button type="button" id="qg-go">起卦</button>
    <button type="button" class="secondary" id="qg-toggleChart" aria-expanded="false">六十四卦吉凶概论</button>
    <div id="qg-out"></div>
    <div id="qg-lightbox" aria-hidden="true"><img alt=""></div>
    <div id="qg-chart">
      <div class="legend" aria-label="吉凶色阶">
        <span>色阶</span>
        <span class="chip"><span class="dot" style="background:var(--tier-red)"></span>红</span>
        <span>&gt;</span>
        <span class="chip"><span class="dot" style="background:var(--tier-blue)"></span>蓝</span>
        <span>&gt;</span>
        <span class="chip"><span class="dot" style="background:var(--tier-black)"></span>黑</span>
        <span>&gt;</span>
        <span class="chip"><span class="dot" style="background:var(--tier-green)"></span>绿</span>
      </div>
      <label for="qg-chartSearch" style="margin-bottom:6px">搜索卦名 / 编码 / 吉凶</label>
      <input id="qg-chartSearch" type="search" placeholder="例如 家人、53、红" autocomplete="off" />
      <div id="qg-jxList"></div>
    </div>
    <footer class="credit">
      <div>作者：<strong>宗燡</strong></div>
    </footer>
  </div>
  </section>

  <section id="view-bz" class="view" aria-label="八字笔记生成器">
<div class="card">
    <button type="button" class="back-btn" data-back="home">← 返回</button>
    <h1>八字笔记生成器</h1>
    <p class="sub">按日期生成「日期 · 星期 · 日干支 · 备注」。立春换年、节气换月时插入标注行。可编辑备注，导出 CSV 或复制全文。</p>
    <div class="row">
      <div class="field">
        <label for="bz-start">起始日期</label>
        <input type="date" id="bz-start" />
      </div>
      <div class="field">
        <label for="bz-end">终止日期</label>
        <input type="date" id="bz-end" />
      </div>
    </div>
    <div class="actions">
      <button type="button" id="bz-gen">生成笔记</button>
      <button type="button" class="secondary" id="bz-csv">导出 CSV</button>
      <button type="button" class="secondary" id="bz-copy">复制全部</button>
    </div>
    <div class="msg" id="bz-msg"></div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th style="width:22%">日期</th><th style="width:14%">星期</th><th style="width:14%">干支</th><th>备注</th></tr>
        </thead>
        <tbody id="bz-tbody"></tbody>
      </table>
    </div>
    <footer class="credit"><div>作者：<strong>宗燡</strong></div></footer>
  </div>
  </section>

  <section id="view-sc" class="view" aria-label="时差计算">
<div class="card">
    <button type="button" class="back-btn" data-back="home">← 返回</button>
    <h1>时差计算</h1>
    <p class="sub">按经度换算东经 120° 标准时与当地平太阳时（每度约 4 分钟）。内置常见城市，可选手动经度；全程离线。</p>

      <div class="suggest" id="sc-suggest"></div>

    <div class="field">
      <label for="sc-time">时间（HH:MM）</label>
      <input id="sc-time" placeholder="HH:MM" value="" />

    function show(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

      if (el) el.classList.add('active');
      window.scrollTo(0, 0);
    }
    document.querySelectorAll('[data-go]').forEach(btn => {
      btn.addEventListener('click', () => show(btn.getAttribute('data-go')));
    });
    document.querySelectorAll('[data-back]').forEach(btn => {
      btn.addEventListener('click', () => show('home'));
    });
  })();

        const info = ANCIENT_CHAR[ch] || { t: "modern" };
        const esc = ch.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
        if (info.t === "modern" || !info.p || !ANCIENT_POOL[info.p]) {
          return `<span class="ag ag-modern">${esc}</span>`;
        }
        const src = "data:image/png;base64," + ANCIENT_POOL[info.p];
        return `<img class="ag-img ag-${info.t}" src="${src}" alt="${esc}" title="${esc}">`;
      }).join("");

    function cast(digits) {
      const n = digits.length;
      let mid = Math.floor(n / 2);
      let upper = digits.slice(0, mid);
      let lower = digits.slice(mid);
      if (!upper.length) { upper = digits.slice(); lower = digits.slice(); }
      const u = mod8(upper.reduce((a,b)=>a+b,0));
      const l = mod8(lower.reduce((a,b)=>a+b,0));
      const name = HEX[u+","+l];
      return { digits, upper, lower, u, l, name, gua_ci: GUA_CI[name], code: u * 10 + l };
    }

    function renderJxList(filter) {
      const q = (filter || "").trim().toLowerCase();
      const list = document.getElementById('qg-jxList');
      const matched = JX.filter(item => {
        if (!q) return true;
        const hay = [item.short, item.full, item.key, String(item.code), item.tier, item.daji ? "大吉" : "", (WX_MAP[item.code]||[]).join(" ")].join(" ").toLowerCase();
        return hay.includes(q);
      });
      if (!matched.length) {
        list.innerHTML = '<div class="jx-empty">无匹配卦象</div>';
        return;

      let html = "";
      let lastTier = null;
      for (const item of matched) {
        if (item.tier !== lastTier) {
          lastTier = item.tier;
          html += `<div class="jx-group-title">${item.tier}阶</div>`;
        }
        const fullHtml = item.full !== item.short
          ? `<span class="full">${item.full}</span>`
          : "";
        const cur = currentCode === item.code ? " current" : "";
        html += `<div class="jx-row${cur}${item.daji ? " daji" : ""}" data-code="${item.code}">` +
          `<span class="jx-badge ${item.tier}">${item.tier}</span>` +
          `<span class="jx-code">${item.key}</span>` +
          `<span class="jx-name"><span class="short">${item.short}</span>${fullHtml}${wxTag(item.code)}</span>` + (item.daji ? `<span class="jx-badge 大吉">大吉</span>` : "") +
          `</div>`;

  }
  function parseYmd(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function addDays(d, n) {
    const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    x.setDate(x.getDate() + n);
    return x;
  }
  function dayDiff(a, b) {
    const ms = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate()) -
               Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round(ms / 86400000);
  }

  function getLichunDate(year) {
    for (let day = 3; day <= 5; day++) {
      const lunar = Solar.fromYmd(year, 2, day).getLunar();
      if (lunar.getJieQi() === '立春') return new Date(year, 1, day);

    return new Date(year, 1, 4);

  function getYearGanZhi(dateObj) {
    let year = dateObj.getFullYear();
    const lichun = getLichunDate(year);
    if (dateObj < lichun) year -= 1;
    const idx = ((year - 4) % 60 + 60) % 60;
    return GANZHI_60[idx];
  }

  function getMonthGanZhi(dateObj) {
    const lunar = Solar.fromYmd(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate()).getLunar();

  }

  function getJieQiName(dateObj) {
    const lunar = Solar.fromYmd(dateObj.getFullYear(), dateObj.getMonth() + 1, dateObj.getDate()).getLunar();

    return jq || '';
  }

  function getDayGanZhi(dateObj) {
    const diff = dayDiff(dateObj, REF);
    const idx = ((REF_INDEX + diff) % 60 + 60) % 60;
    return GANZHI_60[idx];
  }

  function setDefaults() {
    const today = new Date();

    startEl.value = ymd(today);

        if (!changed) { out.push({ type: 'blank' }); changed = true; }
        const jq = getJieQiName(cur);
        out.push({ type: 'banner', text: jq ? `${curYear}年 (${jq})` : `${curYear}年` });
      }
      if (curMonth !== prevMonth) {
        if (!changed) { out.push({ type: 'blank' }); changed = true; }
        const jq = getJieQiName(cur);
        out.push({ type: 'banner', text: jq ? `${curMonth}月 (${jq})` : `${curMonth}月` });
      }

      out.push({
        type: 'day',
        date: ymd(cur),
        week: WEEK[(cur.getDay() + 6) % 7],
        ganzhi: getDayGanZhi(cur),
        note: ''
      });
      prevYear = curYear;
      prevMonth = curMonth;
    }
    return out;
  }

  function render() {
    tbody.innerHTML = '';
    const frag = document.createDocumentFragment();
    rows.forEach((r, idx) => {
      const tr = document.createElement('tr');
      if (r.type === 'blank') {
        tr.className = 'blank';
        tr.innerHTML = '<td colspan="4"></td>';
      } else if (r.type === 'banner') {
        tr.className = 'banner';
        tr.innerHTML = `<td colspan="4">${r.text}</td>`;
      } else {
        tr.innerHTML =
          `<td>${r.date}</td><td>${r.week}</td><td>${r.ganzhi}</td>` +
          `<td class="note"><input data-i="${idx}" value="${(r.note || '').replace(/"/g, '&quot;')}" placeholder="备注…" /></td>`;
      }
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
  }

  tbody.addEventListener('input', (e) => {
    const el = e.target;
    if (el.tagName !== 'INPUT') return;
    const i = Number(el.getAttribute('data-i'));
    if (rows[i] && rows[i].type === 'day') rows[i].note = el.value;
  });

  function generate() {
    if (typeof Solar === 'undefined') {
      setMsg('农历库加载失败，请检查网络后刷新。', 'err');
      return;
    }
    if (!startEl.value || !endEl.value) {
      setMsg('请选择起止日期。', 'err');
      return;
    }
    const start = parseYmd(startEl.value);
    const end = parseYmd(endEl.value);
    if (start > end) {
      setMsg('起始日期不能晚于终止日期。', 'err');
      return;
    }
    const days = dayDiff(end, start) + 1;
    if (days > 400) {
      setMsg(`日期跨度 ${days} 天，较长，仍会生成；建议分段导出。`, 'warn');
    } else {
      setMsg(`已生成 ${days} 天（含年/月标注行）。`);
    }
    rows = buildRows(start, end);
    render();
  }

  function toTsv() {
    const lines = ['日期\t星期\t干支\t备注'];
    rows.forEach((r) => {
      if (r.type === 'blank') lines.push('\t\t\t');
      else if (r.type === 'banner') lines.push(`${r.text}\t\t\t`);
      else lines.push(`${r.date}\t${r.week}\t${r.ganzhi}\t${r.note || ''}`);
    });
    return lines.join('\n');
  }

  function toCsv() {
    const esc = (s) => {
      const t = String(s ?? '');
      if (/[",\n]/.test(t)) return '"' + t.replace(/"/g, '""') + '"';
      return t;
    };
    const lines = ['日期,星期,干支,备注'];
    rows.forEach((r) => {
      if (r.type === 'blank') lines.push(',,,');
      else if (r.type === 'banner') lines.push(`${esc(r.text)},,,`);
      else lines.push([esc(r.date), esc(r.week), esc(r.ganzhi), esc(r.note || '')].join(','));
    });
    return '\uFEFF' + lines.join('\n');
  }

  document.getElementById('bz-gen').onclick = generate;
  document.getElementById('bz-csv').onclick = () => {
    if (!rows.length) { setMsg('请先生成笔记。', 'err'); return; }
    const blob = new Blob([toCsv()], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `八字笔记_${startEl.value}_至_${endEl.value}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
    setMsg('已导出 CSV（UTF-8 BOM，可用 Excel 打开）。');
  };
  document.getElementById('bz-copy').onclick = async () => {
    if (!rows.length) { setMsg('请先生成笔记。', 'err'); return; }
    try {
      await navigator.clipboard.writeText(toTsv());
      setMsg('已复制到剪贴板（制表符分隔，可粘贴到表格）。');
    } catch (_) {
      setMsg('复制失败，请手动选择表格内容。', 'err');
    }
  };

  setDefaults();
  // Auto-generate once library is ready
  function tryAuto() {
    if (typeof Solar !== 'undefined') generate();
    else setTimeout(tryAuto, 80);
  }
  tryAuto();
})();

  function parseTime(str) {
    const parts = String(str).trim().split(':');
    if (parts.length !== 2) throw new Error('时间格式请用 HH:MM，例如 9:28');
    const hour = parseInt(parts[0], 10);
    const minute = parseInt(parts[1], 10);
    if (Number.isNaN(hour) || Number.isNaN(minute)) throw new Error('时间必须为数字');
    if (!(hour >= 0 && hour < 24 && minute >= 0 && minute < 60)) throw new Error('时间数值超出范围');
    return { hour, minute };
  }

  /** 与 Python 一致：int(total_minutes // 60), int(total_minutes % 60) */
  function convertTime(timeStr, targetLon, refLon) {
    const { hour, minute } = parseTime(timeStr);
    const minuteDiff = (targetLon - refLon) * 4.0;
    let total = hour * 60 + minute + minuteDiff;
    total %= (24 * 60);
    if (total < 0) total += 24 * 60;
    const newHour = Math.trunc(total / 60);
    const newMinute = Math.trunc(total % 60);
    return {
      text: String(newHour).padStart(2, '0') + ':' + String(newMinute).padStart(2, '0'),
      minuteDiff
    };
  }

  function score(q, item) {
    const hay = item.name + item.region;
    if (!q) return 0;
    if (item.name === q) return 100;
    if (item.name.startsWith(q)) return 80;
    if (item.name.includes(q)) return 60;
    if (hay.includes(q)) return 40;
    // fuzzy: all chars in order
    let i = 0;
    for (const ch of hay) {
      if (ch === q[i]) i++;
      if (i >= q.length) return 20;
    }
    return -1;
  }

  function filterCities(q) {
    q = (q || '').trim();
    if (!q) return CITIES.slice(0, 12);
    return CITIES

      .filter((x) => x.s >= 0)
      .sort((a, b) => b.s - a.s || a.c.name.localeCompare(b.c.name, 'zh'))
      .slice(0, 12)
      .map((x) => x.c);
  }

      buttons.forEach((b, i) => b.classList.toggle('active', i === activeIdx));

      e.preventDefault();
      activeIdx = (activeIdx - 1 + buttons.length) % buttons.length;
      buttons.forEach((b, i) => b.classList.toggle('active', i === activeIdx));
    } else if (e.key === 'Enter' && activeIdx >= 0) {
      e.preventDefault();
      buttons[activeIdx].click();

        `使用经度 ${lon}°E · Δ = (${direction === 'toLocal' ? lon + ' − 120' : '120 − ' + lon}) × 4 = ${sign}${minuteDiff.toFixed(1)} 分钟`;

      out.classList.remove('show');
      err.textContent = e.message || String(e);
